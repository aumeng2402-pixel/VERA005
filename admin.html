<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>รายการสั่งซื้อ — VERA Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container nav">
      <a href="index.html" class="logo" aria-label="VERA หน้าแรก">VERA</a>
    </div>
  </header>

  <main>
    <section class="page-head">
      <div class="container">
        <h1>รายการสั่งซื้อ</h1>
        <span class="rule"></span>
        <p class="lead">เรียงจากรายการล่าสุดขึ้นก่อน</p>
      </div>
    </section>

    <section class="page-body">
      <div class="container">
        <div class="table-wrap">
          <table id="ordersTable" class="data-table">
            <thead>
              <tr>
                <th scope="col">วันเวลา</th>
                <th scope="col">ชื่อลูกค้า</th>
                <th scope="col">เบอร์โทร/Line</th>
                <th scope="col">รายการสินค้า</th>
                <th scope="col">จำนวนเงินรวม</th>
                <th scope="col">หมายเหตุ</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
